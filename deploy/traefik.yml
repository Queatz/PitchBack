entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    transport:
      respondingTimeouts:
        # SSE / WebSocket are long-lived; default readTimeout is 60s.
        readTimeout: 0s
        writeTimeout: 0s
        idleTimeout: 1800s

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  le:
    acme:
      email: __ACME_EMAIL__
      storage: /var/lib/traefik/acme.json
      httpChallenge:
        entryPoint: web

log:
  level: INFO

accessLog: {}

api:
  dashboard: false
