server {
    listen 127.0.0.1:__NGINX_WEB_PORT__;
    server_name _;

    root /var/www/pitchback;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /config.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
